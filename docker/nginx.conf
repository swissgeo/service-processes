server {
    listen 8000;
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # oauth2-proxy headers for local development
        proxy_set_header X-Auth-Request-Access-Token        "some_token";
        proxy_set_header X-Auth-Request-Groups              "swissgeo-admin";
        proxy_set_header X-Auth-Request-Preferred-Username  "admin";
        proxy_set_header X-Auth-Request-Email               "admin@swissgeo.ch";
        proxy_set_header X-Auth-Request-User                "admin";
    }
}
