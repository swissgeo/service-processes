services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PW}
      POSTGRES_DB: postgres
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PW: ${DB_PW}
    volumes:
      - ./.volumes/postgresql:/var/lib/postgresql
      - ./docker/init-app-database.sh:/docker-entrypoint-initdb.d/init-app-database.sh:ro
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: --config otel-local-config.yaml
    volumes:
      - ./docker/otel-local-config.yaml:/otel-local-config.yaml
    ports:
      - "4317:4317"
    depends_on:
      - jaeger
      - prometheus
    networks:
      - network_local
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # Jaeger UI
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - network_local

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - network_local

  # Sets the oauth2-proxy headers for local development, see README
  nginx:
    image: nginx:stable-alpine
    network_mode: host
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  network_local:
    external: true
    name: service_processes_network
