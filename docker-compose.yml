services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PW}
      POSTGRES_DB: postgres
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PW: ${DB_PW}
    volumes:
      - ./.volumes/postgresql:/var/lib/postgresql
      - ./docker/init-app-database.sh:/docker-entrypoint-initdb.d/init-app-database.sh:ro
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Single container Airflow (SQLite, all components) to trigger DAG runs locally, see README.
  # Only started with the "airflow" profile (make start-airflow), as it is heavy and slow to start.
  airflow:
    image: apache/airflow:3.3.2 # keep in sync with the cluster
    profiles: [airflow]
    # The simple auth manager opens the passwords file for writing, so it can't be mounted (read-only
    # or owned by the host user). Write it inside the container instead: user service, password local
    command: >
      bash -c 'echo "{\"service\": \"local\"}" > /opt/airflow/passwords.json
      && exec airflow standalone'
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Otherwise new DAGs are paused and triggered runs stay queued forever
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      # Simple auth manager user used by the service, password set in command above
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "service:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/passwords.json
    volumes:
      - ./docker/airflow/dags:/opt/airflow/dags:ro
    ports:
      - "8081:8080" # 8080 is used by the app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/version')"]
      interval: 10s
      timeout: 5s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: --config otel-local-config.yaml
    volumes:
      - ./docker/otel-local-config.yaml:/otel-local-config.yaml
    ports:
      - "4317:4317"
    depends_on:
      - jaeger
      - prometheus
    networks:
      - network_local
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # Jaeger UI
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - network_local

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - network_local

  # Sets the oauth2-proxy headers for local development, see README
  nginx:
    image: nginx:stable-alpine
    network_mode: host
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  network_local:
    external: true
    name: service_processes_network
