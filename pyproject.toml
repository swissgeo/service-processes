[project]
name = "service-processes"
readme = "README.md"
requires-python = ">=3.14"
dynamic = ["version"]

#===============================================================================
# Dependencies
dependencies = [
    "alembic~=1.20",
    "asyncpg~=0.31",
    "fastapi[standard]~=0.141",
    "httptools~=0.8",
    "opentelemetry-exporter-otlp~=1.44",
    "opentelemetry-instrumentation-botocore~=0.65b0",
    "opentelemetry-instrumentation-fastapi~=0.65b0",
    "opentelemetry-sdk~=1.44",
    "pydantic-settings~=2.15",
    "sqlalchemy[asyncio]~=2.1",
    "uvloop~=0.22",
]

[dependency-groups]
dev = [
    "pre-commit~=4.6",
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    "pytest-cov~=7.1",
    "pytest-xdist~=3.8",
    "ruff~=0.16",
    "ty~=0.0",
]

#===============================================================================
# uv configuration
[tool.uv]
package = false # Do not install as a package

#===============================================================================
# FastAPI configuration
[tool.fastapi]
entrypoint = "app.main:app"

#===============================================================================
# Ruff configuration
[tool.ruff]
src = ["app"]

# Same as Black.
line-length = 100
indent-width = 4

# Assume Python 3.14
target-version = "py314"

#------------------------------------------------------------------------------
# Linting configuration
[tool.ruff.lint]
exclude = []
select = ["ALL"]
ignore = [
    "ANN401", # Ignore Any typehint
    "ANN002", # Ignore typehint for *args
    "ANN003", # Ignore typehint for **kwargs
    "D",      # Ignore pydocstyle
    "EM",     # Ignore flake8-errmsg
    "FBT001", # Ignore boolean-type-hint-positional-argument
    "FBT002", # Ignore boolean-default-value-positional-argument
    "PTH123", # Ignore builtin-open
    "TD",     # Ignore flake8-todos
    "FIX",    # Ignore fixme comments
    "ERA001", # TODO remove this for production, ignore commented code
    "COM812", # flak8-commas missing-trailing-comma is ignored to avoid conflict with formatter which enforces trailing commas
    "TRY003", # Ignore long messages in exceptions
    "CPY001", # Ignore missing copyright notice in python files

    # Pydantic schemas uses type annotations at runtime to generate the openapi
    # and do the validation. Putting the type annotation in a TYPE_CHECKING
    # block creates weird hard to debug code.
    # Same for fastAPI dependencies which also use type annotations at runtime.
    "TC003", # Ignore type annotation not in TYPE_CHECKING block
    "TC002", # Ignore type annotation not in TYPE_CHECKING block for third party import
    "TC001", # Ignore type annotation not in TYPE_CHECKING block for first party import
]

# Allow fix for all enabled rules (when `--fix`) is provided.
unfixable = []

fixable = ["ALL"]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

#------------------------------------------------------------------------------
# ruff ignore per files
[tool.ruff.lint.per-file-ignores]

"migrations/**" = ["INP001"] # Ignore missing __init__.py files

"app/tests/**" = [
    "S101",    # Ignore usage of assert statements in tests
    "ANN201",  # Ignore missing return type hints in tests
    "PLR2004", # Ignore magic number in tests
    "PLR0913", # Ignore too many arguments in function in tests
]

#------------------------------------------------------------------------------
# Isort configuration
[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "fastapi",
    "test",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
test = ["pytest"]
fastapi = ["fastapi", "pydantic"]

#===============================================================================
# ty configuration
[tool.ty.environment]

[tool.ty.src]
exclude = []

#===============================================================================
# Pytest configuration
[tool.pytest]
pythonpath = ["app"]
python_files = ["test_*.py"]
addopts = []

#==============================================================================
# Coverage configuration
[tool.coverage.run]
omit = ["*/tests/*", "version.py", "otel.py"]

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", "pragma: no cover"]

#==============================================================================
# Alembic configuration
[tool.alembic]

# path to migration scripts.
# this is typically a path given in POSIX (e.g. forward slashes)
# format, relative to the token %(here)s which refers to the location of this
# ini file
script_location = "%(here)s/migrations"

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Files are prepended with date and time so that they sort in creation order
# see https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# for all available tokens
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
# Or organize into date-based subdirectories (requires recursive_version_locations = true)
# file_template = "%%(year)d/%%(month).2d/%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d_%%(rev)s_%%(slug)s"

# additional paths to be prepended to sys.path. defaults to the current working directory.
prepend_sys_path = [
    "."
]

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the tzdata library which can be installed by adding
# `alembic[tz]` to the pip requirements.
# string value is passed to ZoneInfo()
# leave blank for localtime
# timezone =

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# version location specification; This defaults
# to <script_location>/versions.  When using multiple version
# directories, initial revisions must be specified with --version-path.
# version_locations = [
#    "%(here)s/alembic/versions",
#    "%(here)s/foo/bar"
# ]


# set to 'true' to search source files recursively
# in each "version_locations" directory
# new in Alembic version 1.10
# recursive_version_locations = false

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = "utf-8"

# This section defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples

[[tool.alembic.post_write_hooks]]
name = "ruff-format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff-fix"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
